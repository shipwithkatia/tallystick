name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      # Full history and tags: tests/test_a_version_claim_matches_git.py
      # compares what the documents claim about a version against what
      # git shows, and a shallow checkout carries neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,langchain]"
      # The audit path must work with no SDK installed at all.
      - run: python -c "import anthropic" && exit 1 || echo "no sdk, as intended"
      # Dead code and undefined names, before the tests run: a test says
      # whether the code does what it promises, a linter whether any of
      # it does nothing at all. The rules are named in pyproject.toml.
      - run: ruff check .
      - run: pytest -q
      # The laundered example must keep failing - it is the whole point - and
      # the honest one must keep passing, or the gate is not a gate.
      - run: |
          set +e
          tallystick examples/laundered_summary.json; test $? -eq 1 || exit 1
          tallystick examples/balanced_run.json;      test $? -eq 0 || exit 1
      # The benchmark's construction and dry run must work without a model.
      - run: |
          python bench/build.py --ragtruth bench/sample --out /tmp/benchwork --limit 6 --seed 1
          python bench/run.py --work /tmp/benchwork --dry-run
      # A LangChain run, recorded rather than hand-written, must audit the same way.
      - run: |
          set +e
          python examples/langchain_demo.py || exit 1
          tallystick propose raw_langchain.json -o /tmp/lc.json \
            --proposer fake --script examples/fake_answers_langchain.json
          test $? -eq 1
      # The propose path, end to end, with canned answers and no network.
      - run: |
          set +e
          tallystick propose examples/raw_research_run.json -o /tmp/posted.json \
            --proposer fake --script examples/fake_answers.json
          test $? -eq 1
